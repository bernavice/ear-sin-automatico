name: Atualizar painel EAR, ENA, PLD, Mercado, Operacao SIN e Newave

on:
  push:
    branches: [main]
    paths:
      - 'dados/todosnegocios.xlsx'
      - 'dados/preco_horario.csv'
      - 'atualizar_ear.py'
      - 'atualizar_ena.py'
      - 'atualizar_pld.py'
      - 'atualizar_mercado.py'
      - 'atualizar_operacao.py'
      - 'atualizar_newave.py'
      - 'atualizar_decomp.py'
      - 'dados/bd_rodada_decomp.xlsx'
      - 'dados/Produtos Novo.xlsx'
      - 'dados/Produto Novo.xlsx'
      - 'requirements-ear.txt'
  schedule:
    - cron: '15 20 * * *'
      timezone: 'America/Sao_Paulo'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel-hidrologico-ons
  cancel-in-progress: false

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessario para sincronizar commits antes do push.
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ear.txt
      - name: Instalar bibliotecas
        run: |
          pip install -r requirements-ear.txt
          pip install 'playwright>=1.55,<2' 'openpyxl>=3.1,<4'
      - name: Instalar Chromium para consulta ao formulario CCEE
        run: python -m playwright install --with-deps chromium
      - name: Atualizar EAR
        run: python atualizar_ear.py
      - name: Atualizar PLD CCEE e graficos
        run: python atualizar_pld.py
      - name: Diagnostico da coleta pelo formulario da CCEE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pld-ccee
          path: dados/diagnostico_formulario_ccee.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Atualizar ENA e pagina inicial
        run: python atualizar_ena.py
      - name: Atualizar Preco de Mercado e pagina principal
        run: python atualizar_mercado.py
      - name: Atualizar Operacao do SIN (ONS balanco horario)
        run: python atualizar_operacao.py
      - name: Atualizar Projecoes Newave
        run: python atualizar_newave.py
      - name: Atualizar Projeções Decomp
        run: python atualizar_decomp.py
      - name: Conferir painel completo
        run: |
          python - <<'PYVALID'
          from pathlib import Path
          import pandas as pd
          page = Path('graficos/index.html').read_text(encoding='utf-8')
          assert all(s in page for s in ['botao-ear', 'botao-ena', 'botao-pld', 'botao-mercado', 'botao-operacao', 'ear_sin.html', 'ena.html', 'pld.html', 'mercado.html', 'operacao.html'])
          pld = pd.read_csv('dados/pld_historico_long.csv', sep=';', decimal=',')
          assert {'data','hora','submercado','pld'}.issubset(pld.columns)
          assert set(pld['submercado'].unique()) == {'SE/CO', 'SUL', 'NE', 'N'}
          assert len(pld) > 0
          assert Path('graficos/pld.html').exists()
          assert Path('graficos/mercado.html').exists()
          assert Path('graficos/operacao.html').exists()
          assert Path('graficos/newave.html').exists()
          assert 'botao-newave' in page
          assert 'botao-decomp' in page
          assert Path('graficos/decomp.html').exists()
          assert Path('dados/historico_precos_bbce.csv').exists()
          print('Painel EAR + ENA + PLD gerado. PLD ate', pld['data'].max())
          PYVALID
      - name: Registrar dados e graficos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/ear_diaria.csv dados/ear_mensal.csv dados/ena_diaria.csv dados/ena_mensal.csv dados/pld_historico_long.csv
          git add dados/historico_precos_bbce.csv dados/precos_mercado_diario.csv dados/produtos_mercado.csv
          git add graficos/ear_sin.html graficos/ena.html graficos/pld.html graficos/mercado.html graficos/operacao.html graficos/newave.html graficos/decomp.html graficos/index.html
          if [ -f dados/newave_resumo.json ]; then git add dados/newave_resumo.json; fi
          if [ -d dados/operacao_sin ]; then git add -A dados/operacao_sin; fi
          git add -A graficos/operacao_sin
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualizar painel EAR ENA PLD Mercado e Operacao"
            # Um commit pode ter sido enviado ao GitHub durante esta execucao.
            # Sincroniza sem force-push e repete a tentativa se a main avancar.
            publicado=false
            for tentativa in 1 2 3 4 5; do
              echo "Tentativa de publicacao ${tentativa}/5"
              git fetch --no-tags origin main
              if ! git rebase origin/main; then
                echo "::error::Conflito durante a sincronizacao com a main. Nenhum arquivo remoto foi sobrescrito. Execute novamente a Action apos revisar o conflito."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                publicado=true
                break
              fi
              echo "Main alterada enquanto a Action publicava; nova tentativa apos 3 segundos."
              sleep 3
            done
            if [ "$publicado" != "true" ]; then
              echo "::error::Nao foi possivel publicar apos 5 tentativas. Nenhum force-push foi executado."
              exit 1
            fi
          fi
      - name: Preparar site GitHub Pages
        run: |
          mkdir -p site
          cp graficos/index.html site/index.html
          cp graficos/ear_sin.html site/ear_sin.html
          cp graficos/ena.html site/ena.html
          cp graficos/pld.html site/pld.html
          cp graficos/mercado.html site/mercado.html
          cp graficos/operacao.html site/operacao.html
          cp graficos/newave.html site/newave.html
          cp graficos/decomp.html site/decomp.html
          cp -r graficos/operacao_sin site/operacao_sin
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: atualizar-dados
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar painel
        id: deployment
        uses: actions/deploy-pages@v4
