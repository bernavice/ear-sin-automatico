
name: Atualizar EAR do SIN

on:
  schedule:
    - cron: '15 20 * * *'
      timezone: 'America/Sao_Paulo'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizacao-ear
  cancel-in-progress: false

jobs:
  atualizar-ear:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ear.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ear.txt

      - name: Atualizar dados e grafico
        run: python atualizar_ear.py

      - name: Salvar atualizacoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados/ear_diaria.csv dados/ear_mensal.csv graficos/ear_sin.html

          if git diff --staged --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualizacao automatica EAR SIN"
            git push
          fi

      - name: Preparar pagina HTML
        run: |
          mkdir -p site
          cp graficos/ear_sin.html site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar pagina para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    needs: atualizar-ear
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar grafico no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
